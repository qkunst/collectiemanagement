services:
  postgresql:
    image: "postgres:17"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
    ports:
      - '5432:5432'
  elasticsearch:
    image: "elasticsearch:9.4.8"
    ports:
      - "59200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=PleaseChangeMe
  redis:
    image: "redis"
    ports:
      - "6379:6379"
